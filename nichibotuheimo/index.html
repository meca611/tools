<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日沒閉門 - 日の出・日の入時刻</title>
    <!-- ファビコンを「門」の漢字に設定 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-family=%22serif%22>門</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            transition: background-color 2s ease, color 2s ease;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        
        .vertical-text-box {
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 160px;
            overflow-x: auto;
        }
        @media (min-width: 768px) {
            .vertical-text-box {
                height: 200px;
            }
        }
        
        /* 時間帯ごとのテーマ */
        .theme-day {
            background-color: #f4f1ea; /* 和紙のような白 */
            color: #111111; /* UD: コントラストを高めるため濃い黒に */
        }
        .theme-night {
            background-color: #111111; /* 深い夜の色 */
            color: #ffffff;
        }
        .theme-dawn {
            background: linear-gradient(to bottom, #BCE2E8, #FCCCB4); /* UD対応の明るい東雲色 */
            color: #111111;
        }
        .theme-dusk {
            background: linear-gradient(to bottom, #002C7A, #C73A31); /* UD対応の濃い茜色 */
            color: #ffffff;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="theme-day min-h-screen flex flex-col items-center justify-center p-4 pb-32 relative overflow-x-hidden">

    <!-- 背景の装飾的な円（太陽/月） -->
    <div id="celestial-body" class="absolute w-64 h-64 md:w-80 md:h-80 rounded-full opacity-30 transition-all duration-[3000ms] blur-xl" style="top: 10%; right: 10%;"></div>

    <main class="z-10 flex flex-col md:flex-row-reverse items-center md:items-start gap-8 md:gap-16 fade-in bg-white/10 backdrop-blur-md p-6 md:p-12 rounded-sm border border-current shadow-2xl max-w-5xl w-full my-auto">
        
        <!-- タイトルエリア（縦書き） -->
        <div class="flex flex-col items-center justify-start md:mt-4 shrink-0">
            <h1 class="vertical-text text-4xl md:text-6xl tracking-[0.5em] font-medium mb-4 md:mb-6">
                <span id="gate-status-title">日沒閉門</span>
            </h1>
            <p class="vertical-text text-[14px] md:text-[16px] tracking-widest font-medium opacity-90" id="literary-text">
                日が沈めば、門を閉ざす。
            </p>
        </div>

        <!-- データ表示エリア -->
        <div class="flex-1 w-full flex flex-col justify-center gap-8 md:gap-10">
            
            <!-- 上部：ステータスと現在時刻 -->
            <div class="text-center md:text-left border-b border-current pb-6 md:pb-8">
                <!-- ステータスを現在時刻の近くに配置 -->
                <div class="inline-block border border-current px-5 py-1.5 rounded-full bg-black/5 font-bold mb-5 md:mb-6">
                    <span class="tracking-widest text-[14px] md:text-[16px]" id="gate-status">門の状態を確認中...</span>
                </div>

                <div class="flex flex-col items-center md:items-start gap-2">
                    <p class="text-[12px] md:text-[14px] tracking-widest font-bold flex flex-wrap items-center justify-center md:justify-start gap-2">
                        <span>現在時刻</span>
                        <span class="text-[10px] font-normal border border-current px-1.5 py-0.5 rounded-sm opacity-80 whitespace-nowrap">日本標準時 JST</span>
                    </p>
                    <div class="text-[13px] md:text-[14px] font-medium tracking-wider" id="current-date">----（--）年--月--日</div>
                    
                    <div class="text-5xl md:text-6xl font-medium tracking-widest flex justify-center md:justify-start items-baseline my-1" id="current-time">--:--</div>
                    
                    <div class="text-[13px] md:text-[14px] mt-1 flex items-center justify-center md:justify-start gap-1 font-medium opacity-90">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                        <span id="location-name">東京都千代田区 (三畳御殿)</span>
                    </div>
                </div>
            </div>

            <!-- 中部：日の出・日の入 -->
            <div class="grid grid-cols-2 gap-4 md:gap-8 text-center md:text-left">
                <div class="bg-black/5 p-4 rounded-sm border border-current/20">
                    <div class="flex flex-col items-center md:items-start">
                        <i data-lucide="sunrise" class="w-6 h-6 md:w-8 md:h-8 mb-2"></i>
                        <p class="text-[13px] md:text-[14px] tracking-widest mb-1 font-bold">開門（日の出）</p>
                        <p class="text-3xl md:text-4xl font-medium" id="sunrise-time">--:--</p>
                        <p class="text-[11px] md:text-[12px] mt-1 opacity-80 tracking-widest font-mono" id="sunrise-date">----.--.--</p>
                    </div>
                </div>
                <div class="bg-black/5 p-4 rounded-sm border border-current/20">
                    <div class="flex flex-col items-center md:items-start">
                        <i data-lucide="sunset" class="w-6 h-6 md:w-8 md:h-8 mb-2"></i>
                        <p class="text-[13px] md:text-[14px] tracking-widest mb-1 font-bold">閉門（日の入）</p>
                        <p class="text-3xl md:text-4xl font-medium" id="sunset-time">--:--</p>
                        <p class="text-[11px] md:text-[12px] mt-1 opacity-80 tracking-widest font-mono" id="sunset-date">----.--.--</p>
                    </div>
                </div>
            </div>

            <!-- 下部：アクション（ボタン・リンク）と独白 -->
            <div class="flex flex-col gap-6 w-full">
                
                <!-- ユーティリティリンク群 -->
                <div class="flex flex-col md:flex-row items-center md:items-start gap-4 md:gap-6">
                    <div class="flex flex-col items-center md:items-start w-full md:w-auto">
                        <button onclick="requestLocation()" class="w-full md:w-auto text-[13px] md:text-[14px] font-bold hover:bg-current hover:text-white transition-colors tracking-wider p-3 border border-current rounded-sm flex items-center justify-center gap-2">
                            <i data-lucide="navigation" class="w-4 h-4"></i>
                            現在地から計算
                        </button>
                        <p id="error-msg" class="text-[12px] md:text-[14px] font-bold text-[#FF2800] mt-2 hidden bg-white/90 p-1.5 inline-block rounded border border-[#FF2800] w-full text-center"></p>
                    </div>
                    
                    <a href="https://meca611.github.io/tools/otukimi/index.html" target="_blank" rel="noopener noreferrer" class="w-full md:w-auto text-[13px] md:text-[14px] font-bold hover:bg-current hover:text-white transition-colors tracking-wider p-3 border border-current rounded-sm flex items-center justify-center gap-2">
                        <i data-lucide="moon" class="w-4 h-4"></i>
                        月齢カレンダー
                    </a>
                </div>

                <!-- ✨ 先生の独白（Gemini API） -->
                <div class="border-t border-current/30 pt-6 w-full mt-2">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                        <p class="text-[14px] tracking-widest font-bold flex items-center gap-2 justify-center sm:justify-start">
                            <i data-lucide="feather" class="w-4 h-4"></i>
                            文豪の独り言
                        </p>
                        <button onclick="generateMonologue()" id="btn-generate" class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2.5 border border-current rounded-full hover:opacity-70 transition-opacity font-bold text-[14px] bg-white/20 shadow-sm">
                            <span>✨ 今の心境を窺う</span>
                        </button>
                    </div>
                    
                    <div id="monologue-container" class="hidden w-full bg-white/20 p-6 md:p-8 rounded-sm border border-current shadow-inner flex justify-center min-h-[160px] md:min-h-[200px] relative">
                        <!-- 装飾用の角 -->
                        <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-current"></div>
                        <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-current"></div>
                        <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-current"></div>
                        <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-current"></div>
                        
                        <div id="monologue-loading" class="absolute inset-0 flex items-center justify-center">
                            <p class="text-[14px] font-bold tracking-widest animate-pulse flex items-center gap-2">
                                <i data-lucide="pen-tool" class="w-4 h-4 animate-bounce"></i>
                                筆を執っております...
                            </p>
                        </div>
                        <p id="monologue-text" class="vertical-text-box text-[15px] md:text-[16px] leading-loose font-medium hidden text-inherit w-full"></p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="absolute bottom-0 left-0 w-full py-4 px-4 flex flex-col items-center justify-center z-20 opacity-90">
        <div class="mb-2 flex items-center justify-center" aria-label="mecalogo-color">
            <span class="font-bold border-2 border-[#8C6589] text-[#8C6589] px-3 py-1 tracking-widest text-[14px]">MECA</span>
        </div>
        <p class="text-[12px] md:text-[14px] font-bold mb-1">しんやせっけいしゃ（MECA）</p>
        <p class="text-[10px] md:text-[12px] opacity-80">&copy; 2026 Midnight Express Computational Archives</p>
    </footer>

    <script>
        // Lucideアイコンの初期化
        lucide.createIcons();

        // Gemini API Key
        const apiKey = "";

        // デフォルト位置（東京都千代田区 三畳御殿付近）
        let currentLat = 35.6900;
        let currentLng = 139.7350;
        
        // 状態（今日と明日のデータを保持）
        let sunDataToday = null;
        let sunDataTomorrow = null;
        let clockInterval = null;

        // 初期化
        async function init() {
            if (clockInterval) clearInterval(clockInterval);
            startClock();
            await fetchAllSunData(currentLat, currentLng);
        }

        // 時計の更新
        function startClock() {
            clockInterval = setInterval(() => {
                const now = new Date();
                
                const currentDateEl = document.getElementById('current-date');
                const currentTimeEl = document.getElementById('current-time');
                
                // DOMが存在しない場合は処理をスキップ（エラー防止）
                if (!currentDateEl || !currentTimeEl) return;
                
                // 現在の日付（西暦・和暦・曜日）の更新
                const year = now.getFullYear();
                const reiwaYear = year - 2018; // 2019年が令和1年
                const month = now.getMonth() + 1;
                const day = now.getDate();
                
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const dayIndex = now.getDay();
                let dayClass = "";
                if (dayIndex === 0) {
                    dayClass = "text-[#FF2800] font-bold"; // 日曜はUDの赤系
                } else if (dayIndex === 6) {
                    dayClass = "text-[#005AFF] font-bold"; // 土曜はUDの青系
                }
                
                currentDateEl.innerHTML = `${year}（令和${reiwaYear}）年${month}月${day}日<span class="${dayClass}">（${days[dayIndex]}）</span>`;

                // 時間のゼロ埋めをしない設定 (hour: 'numeric')
                const timeStr = now.toLocaleTimeString('ja-JP', { hour12: false, hour: 'numeric', minute: '2-digit', second: '2-digit' });
                
                // 秒を小さく表示するための分割処理
                const parts = timeStr.split(':');
                if(parts.length === 3) {
                    const h = parts[0];
                    const m = parts[1];
                    const s = parts[2];
                    currentTimeEl.innerHTML = `${h}:${m}<span class="text-2xl md:text-3xl ml-1 md:ml-2">:${s}</span>`;
                } else {
                    currentTimeEl.textContent = timeStr;
                }

                updateDisplayData(now);
                updateTheme(now);
            }, 1000);
        }

        // 指定した日付の太陽データを取得
        async function fetchSunDataForDate(lat, lng, date) {
            const dateString = `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
            const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&date=${dateString}&formatted=0`;
            const response = await fetch(url);
            return await response.json();
        }

        // 今日と明日のデータを一括取得
        async function fetchAllSunData(lat, lng) {
            try {
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                const [todayData, tomorrowData] = await Promise.all([
                    fetchSunDataForDate(lat, lng, today),
                    fetchSunDataForDate(lat, lng, tomorrow)
                ]);

                if (todayData.status === "OK" && tomorrowData.status === "OK") {
                    sunDataToday = {
                        sunrise: new Date(todayData.results.sunrise),
                        sunset: new Date(todayData.results.sunset)
                    };
                    sunDataTomorrow = {
                        sunrise: new Date(tomorrowData.results.sunrise),
                        sunset: new Date(tomorrowData.results.sunset)
                    };
                    
                    updateDisplayData(new Date());
                    updateTheme(new Date());
                }
            } catch (error) {
                console.error("API呼び出しエラー:", error);
                const errorMsg = document.getElementById('error-msg');
                if (errorMsg) {
                    errorMsg.textContent = "データの取得に失敗しました。";
                    errorMsg.classList.remove('hidden');
                }
            }
        }

        // 表示するデータ（今日か明日か）を判定してUIを更新
        function updateDisplayData(now) {
            if (!sunDataToday || !sunDataTomorrow) return;

            const sunriseTimeEl = document.getElementById('sunrise-time');
            const sunsetTimeEl = document.getElementById('sunset-time');
            const sunriseDateEl = document.getElementById('sunrise-date');
            const sunsetDateEl = document.getElementById('sunset-date');

            // 要素が存在しない場合のエラーを防ぐ
            if (!sunriseTimeEl || !sunsetTimeEl || !sunriseDateEl || !sunsetDateEl) return;

            let displaySunrise = sunDataToday.sunrise;
            let isNextDaySunrise = false;
            if (now > sunDataToday.sunrise) {
                displaySunrise = sunDataTomorrow.sunrise;
                isNextDaySunrise = true;
            }

            let displaySunset = sunDataToday.sunset;
            let isNextDaySunset = false;
            if (now > sunDataToday.sunset) {
                displaySunset = sunDataTomorrow.sunset;
                isNextDaySunset = true;
            }

            sunriseTimeEl.textContent = formatTime(displaySunrise);
            sunsetTimeEl.textContent = formatTime(displaySunset);
            
            // 日付と「翌日」ラベルの設定
            const nextDayBadge = '<span class="ml-2 text-[10px] border border-current px-1.5 py-0.5 rounded-sm opacity-80 bg-black/5">翌日</span>';
            sunriseDateEl.innerHTML = formatSimpleDate(displaySunrise) + (isNextDaySunrise ? nextDayBadge : '');
            sunsetDateEl.innerHTML = formatSimpleDate(displaySunset) + (isNextDaySunset ? nextDayBadge : '');
        }

        // 時間のフォーマット (H:MM - ゼロ埋めなし)
        function formatTime(date) {
            return date.toLocaleTimeString('ja-JP', { hour: 'numeric', minute: '2-digit', hour12: false });
        }

        // 日付のシンプルなフォーマット (YYYY.MM.DD)
        function formatSimpleDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        // 時間帯に応じたテーマとテキストの更新
        function updateTheme(now) {
            if (!sunDataToday) return;

            const body = document.body;
            const statusEl = document.getElementById('gate-status');
            const titleEl = document.getElementById('gate-status-title');
            const litTextEl = document.getElementById('literary-text');
            const celestial = document.getElementById('celestial-body');

            // 要素が存在しない場合のエラーを防ぐ
            if (!statusEl || !titleEl || !litTextEl || !celestial || !body) return;

            // クラスのリセット
            body.classList.remove('theme-day', 'theme-night', 'theme-dawn', 'theme-dusk');

            const nowTime = now.getTime();
            // テーマ判定は「今日の日の出・日の入」を基準に行う
            const riseTime = sunDataToday.sunrise.getTime();
            const setTime = sunDataToday.sunset.getTime();

            // 夜明け前・夕暮れ時のマージン（前後30分）
            const margin = 30 * 60 * 1000;

            if (nowTime < riseTime - margin || nowTime > setTime + margin) {
                // 完全に夜（閉門中）
                body.classList.add('theme-night');
                statusEl.textContent = "現在は【閉門】しています";
                titleEl.textContent = "日沒閉門";
                litTextEl.textContent = "外界の喧騒を遮断し、静寂を嗜む。";
                celestial.style.backgroundColor = "#cbd5e1"; // 月明かり
                celestial.style.top = "10%";
            } else if (nowTime >= riseTime - margin && nowTime < riseTime + margin) {
                // 夜明け（開門準備）
                body.classList.add('theme-dawn');
                statusEl.textContent = "まもなく【開門】します";
                titleEl.textContent = "東雲開門";
                litTextEl.textContent = "夜が明け、新しい一日が始まる。";
                celestial.style.backgroundColor = "#fbbf24"; // 朝日
                celestial.style.top = "50%";
            } else if (nowTime >= setTime - margin && nowTime < setTime + margin) {
                // 夕暮れ（閉門準備）
                body.classList.add('theme-dusk');
                statusEl.textContent = "まもなく【閉門】します";
                titleEl.textContent = "黄昏閉門";
                litTextEl.textContent = "日が沈みゆく。帰るべき時間。";
                celestial.style.backgroundColor = "#ef4444"; // 夕日
                celestial.style.top = "50%";
            } else {
                // 昼間（開門中）
                body.classList.add('theme-day');
                statusEl.textContent = "現在は【開門】しています";
                titleEl.textContent = "日出開門";
                litTextEl.textContent = "門は開かれている。外界と交わる時間。";
                celestial.style.backgroundColor = "#f59e0b"; // 太陽
                celestial.style.top = "-10%";
            }
        }

        // ユーザーの現在地を取得
        function requestLocation() {
            const errorMsg = document.getElementById('error-msg');
            if (errorMsg) errorMsg.classList.add('hidden');

            if (!navigator.geolocation) {
                if (errorMsg) {
                    errorMsg.textContent = "お使いのブラウザは位置情報に対応していません。";
                    errorMsg.classList.remove('hidden');
                }
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    const locName = document.getElementById('location-name');
                    if (locName) locName.textContent = "現在地 (GPS)";
                    await fetchAllSunData(currentLat, currentLng);
                },
                (error) => {
                    if (errorMsg) {
                        errorMsg.textContent = "位置情報の取得が許可されませんでした。";
                        errorMsg.classList.remove('hidden');
                    }
                }
            );
        }

        // Gemini API 呼び出し用のリトライ処理
        async function fetchWithRetry(url, options, maxRetries = 5) {
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];

            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    retries++;
                    if (retries >= maxRetries) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[retries - 1]));
                }
            }
        }

        // 先生の独白を生成 (Gemini API)
        async function generateMonologue() {
            const btn = document.getElementById('btn-generate');
            const container = document.getElementById('monologue-container');
            const loading = document.getElementById('monologue-loading');
            const textEl = document.getElementById('monologue-text');

            if (!btn || !container || !loading || !textEl) return;

            // UI更新
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            container.classList.remove('hidden');
            loading.classList.remove('hidden');
            textEl.classList.add('hidden');
            textEl.textContent = "";

            // 現在の情報を取得してプロンプトに組み込む
            const gateStatusEl = document.getElementById('gate-status');
            const currentTimeEl = document.getElementById('current-time');
            const currentDateEl = document.getElementById('current-date');
            
            const gateStatus = gateStatusEl ? gateStatusEl.textContent : "不明";
            const timeStr = currentTimeEl ? currentTimeEl.textContent.replace(/<[^>]*>?/gm, '') : "";
            const dateStr = currentDateEl ? currentDateEl.textContent.replace(/<[^>]*>?/gm, '') : "";

            const prompt = `あなたは昭和の文豪、内田百閒のような人物です。偏屈でマイペース、外界の煩わしさを嫌いながらも、猫（ノラヤなど）や酒、鉄道、そして「日没閉門」の生活を愛しています。
現在の日時は「${dateStr} ${timeStr}」、門の状態は「${gateStatus}」です。
この状況を踏まえ、今の心境や目の前の情景を、短い随筆（3〜4文程度、最大100文字）で語ってください。
文体は古風で、飄々とした語り口にしてください。`;

            try {
                if (!apiKey) throw new Error("APIキーが設定されていません。");

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: {
                        parts: [{ text: "あなたは内田百閒のような日本の文豪です。短い随筆を出力してください。プレーンテキストのみを出力し、マークダウンなどは使用しないでください。" }]
                    }
                };

                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (generatedText) {
                    textEl.textContent = generatedText;
                } else {
                    textEl.textContent = "ふいと、言葉が途切れてしまった。";
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                textEl.textContent = "筆が進まない。また後で来てくれ給え。";
            } finally {
                loading.classList.add('hidden');
                textEl.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // HTMLの読み込みが完全に終わってから起動（エラー防止）
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    </script>
</body>
</html>
